# S1 follow-up on the WSL testbed: Reno vs CUBIC on pfifo with 180 s flows.
# The 60 s runs (s1w) gave Reno 34-56% from run to run with only 14-24 retransmits per flow,
# too few loss cycles to settle. Same setting, three times longer.
scenario: s1l
trials: 5
duration: 180         # seconds per flow
omit: 5               # slow start excluded from iperf3's summary
defaults: {rate: 50, rtt: 40, buf_bdp: 1.0, qdisc: pfifo}
grid:
  - {n: 2, rtt_mode: equal, cca_mix: reno+cubic, qdisc: pfifo}
